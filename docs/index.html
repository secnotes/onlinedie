<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detect It Easy - Web</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 Detect It Easy - Web</h1>
            <p class="subtitle">纯前端文件类型识别工具 | 基于签名检测</p>
        </header>

        <main>
            <div class="upload-area" id="dropZone">
                <div class="upload-icon">📁</div>
                <p>拖放文件到此处或点击上传</p>
                <input type="file" id="fileInput" hidden>
                <button class="btn-primary" onclick="document.getElementById('fileInput').click()">
                    选择文件
                </button>
            </div>

            <div class="file-info" id="fileInfo" style="display: none;">
                <div class="info-header">
                    <span class="filename" id="fileName"></span>
                    <span class="filesize" id="fileSize"></span>
                </div>
                <div class="info-grid">
                    <div class="info-item">
                        <label>MD5</label>
                        <span id="hashMD5" class="hash-value">-</span>
                    </div>
                    <div class="info-item">
                        <label>SHA256</label>
                        <span id="hashSHA256" class="hash-value">-</span>
                    </div>
                    <div class="info-item">
                        <label>Entropy</label>
                        <span id="entropy">-</span>
                    </div>
                </div>
            </div>

            <div class="results" id="results" style="display: none;">
                <h2>检测结果</h2>

                <div class="result-section" id="formatSection">
                    <h3>📋 文件格式</h3>
                    <div class="result-content" id="formatResult"></div>
                </div>

                <div class="result-section" id="compilerSection" style="display: none;">
                    <h3>⚙️ 编译器/链接器</h3>
                    <div class="result-content" id="compilerResult"></div>
                </div>

                <div class="result-section" id="packerSection" style="display: none;">
                    <h3>📦 打包器/保护器</h3>
                    <div class="result-content" id="packerResult"></div>
                </div>

                <div class="result-section" id="librarySection" style="display: none;">
                    <h3>📚 库/框架</h3>
                    <div class="result-content" id="libraryResult"></div>
                </div>

                <div class="result-section" id="detailSection" style="display: none;">
                    <h3>📄 详细信息</h3>
                    <div class="result-content" id="detailResult"></div>
                </div>

                <div class="result-section" id="stringsSection" style="display: none;">
                    <h3>📝 可打印字符串</h3>
                    <div class="result-content strings-content" id="stringsResult"></div>
                </div>
            </div>

            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>正在分析文件...</p>
            </div>
        </main>

        <footer>
            <p>基于 <a href="https://github.com/horsicq/detect-it-easy" target="_blank">Detect It Easy</a> 的签名库 | 纯前端实现</p>
        </footer>
    </div>

    <script src="js/md5.js"></script>
    <script src="js/signatures.js"></script>
    <script src="js/die-signatures.js"></script>
    <script src="js/die-signatures-full.js"></script>
    <script src="js/msdos-signatures.js"></script>
    <script src="js/elf-signatures-full.js"></script>
    <script src="js/file-parser.js"></script>
    <script src="js/die-engine.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
