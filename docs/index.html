<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detect It Easy - Web</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        // 在渲染前获取浏览器主题和语言偏好
        (function() {
            // 主题检测
            const savedTheme = localStorage.getItem("theme");
            if (savedTheme) {
                document.documentElement.setAttribute("data-theme", savedTheme);
            } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
                document.documentElement.setAttribute("data-theme", "dark");
            } else {
                document.documentElement.setAttribute("data-theme", "light");
            }

            // 语言检测
            const savedLang = localStorage.getItem("lang");
            if (savedLang) {
                document.documentElement.setAttribute("data-lang", savedLang);
                document.documentElement.lang = savedLang === 'zh' ? 'zh-CN' : 'en';
            } else {
                // 根据浏览器语言判断
                const browserLang = navigator.language || navigator.userLanguage;
                const isChinese = browserLang.startsWith('zh');
                const defaultLang = isChinese ? 'zh' : 'en';
                document.documentElement.setAttribute("data-lang", defaultLang);
                document.documentElement.lang = defaultLang === 'zh' ? 'zh-CN' : 'en';
                localStorage.setItem("lang", defaultLang);
            }
        })();
    </script>
</head>
<body>
    <!-- 主题切换按钮 -->
    <button id="theme-toggle" title="切换主题">
        <svg id="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2"/></svg>
        <svg id="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/><line x1="12" y1="1" x2="12" y2="3" stroke="currentColor" stroke-width="2"/><line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" stroke-width="2"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2"/><line x1="1" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2"/><line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="currentColor" stroke-width="2"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <!-- 语言切换按钮 -->
    <button id="lang-toggle" title="切换语言">EN</button>

    <div class="container">
        <header>
            <h1>🔍 Detect It Easy - Web</h1>
            <p class="subtitle" data-i18n="subtitle">基于 DIE-engine WASM 的文件检测工具</p>
            <div class="engine-status" id="engineStatus">
                <span class="status-indicator" id="statusIndicator">⏳</span>
                <span id="statusText">正在加载 WASM...</span>
            </div>
        </header>

        <main>
            <div class="upload-area" id="dropZone">
                <div class="upload-icon">📁</div>
                <p data-i18n="upload-tip">拖放文件到此处或点击上传</p>
                <input type="file" id="fileInput" hidden>
                <button class="btn-primary" onclick="document.getElementById('fileInput').click()" data-i18n="select-file">
                    选择文件
                </button>
            </div>

            <div class="file-info" id="fileInfo" style="display: none;">
                <div class="info-header">
                    <span class="filename" id="fileName"></span>
                    <span class="filesize" id="fileSize"></span>
                </div>
                <div class="info-grid">
                    <div class="info-item">
                        <label>MD5</label>
                        <span id="hashMD5" class="hash-value">-</span>
                    </div>
                    <div class="info-item">
                        <label>SHA256</label>
                        <span id="hashSHA256" class="hash-value">-</span>
                    </div>
                    <div class="info-item">
                        <label>Entropy</label>
                        <span id="entropy">-</span>
                    </div>
                </div>
            </div>

            <div class="results" id="results" style="display: none;">
                <h2 data-i18n="results">检测结果</h2>

                <div class="result-section" id="formatSection">
                    <h3>📋 <span data-i18n="format">文件格式</span></h3>
                    <div class="result-content" id="formatResult"></div>
                </div>

                <div class="result-section" id="compilerSection" style="display: none;">
                    <h3>⚙️ <span data-i18n="compiler">编译器/链接器</span></h3>
                    <div class="result-content" id="compilerResult"></div>
                </div>

                <div class="result-section" id="packerSection" style="display: none;">
                    <h3>📦 <span data-i18n="packer">打包器/保护器</span></h3>
                    <div class="result-content" id="packerResult"></div>
                </div>

                <div class="result-section" id="librarySection" style="display: none;">
                    <h3>📚 <span data-i18n="library">库/框架</span></h3>
                    <div class="result-content" id="libraryResult"></div>
                </div>

                <div class="result-section" id="rawOutputSection" style="display: none;">
                    <div class="section-header">
                        <h3>📄 <span data-i18n="raw-output">原始输出</span></h3>
                        <div class="format-buttons">
                            <button class="btn-small active" id="btnText" onclick="switchOutputFormat('text')">Text</button>
                            <button class="btn-small" id="btnJson" onclick="switchOutputFormat('json')">JSON</button>
                            <button class="btn-small" id="btnXml" onclick="switchOutputFormat('xml')">XML</button>
                        </div>
                    </div>
                    <div class="result-content raw-output" id="rawOutput"></div>
                </div>
            </div>

            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p data-i18n="analyzing">正在分析文件...</p>
            </div>

            <div class="error-message" id="errorMessage" style="display: none;">
                <p id="errorText"></p>
            </div>
        </main>

        <footer>
            <p>
                © 2026 <a href="https://github.com/secnotes" target="_blank">Security Notes</a>
                <span class="footer-separator">|</span>
                <a href="https://github.com/secnotes/onlinedie" target="_blank" class="github-link">
                    <svg class="github-icon" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.938 9.9 9.207 11.387.68.113.893-.261.893-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.218.694.825.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                    Star on GitHub
                </a>
            </p>
            <p data-i18n="based-on">
                Based on <a href="https://github.com/horsicq/DIE-engine" target="_blank">DIE-engine</a> compiled to WebAssembly
            </p>
        </footer>
    </div>

    <!-- WASM 加载 -->
    <script>
        // 检测是否是 file:// 协议
        const isLocalFile = window.location.protocol === 'file:';

        // 全局输出缓冲区
        window.dieOutputBuffer = '';

        // 当前状态 key（用于语言切换时重新翻译 statusText）
        window.currentStatusKey = 'loading';
        window.currentStatusDetail = '';

        // 统一设置状态的辅助函数
        window.setStatus = function(key, detail) {
            window.currentStatusKey = key;
            window.currentStatusDetail = detail || '';
            const translated = i18n.t(key) || key;
            document.getElementById('statusText').textContent =
                detail ? `${translated}: ${detail}` : translated;
        };

        window.dieWasmInit = async function() {
            const statusIndicator = document.getElementById('statusIndicator');
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');

            if (isLocalFile) {
                window.setStatus('local-mode');
                statusIndicator.textContent = '⚠️';
                statusIndicator.className = 'status-indicator basic-active';
                errorDiv.style.display = 'block';
                errorText.textContent = i18n.t('local-error');
                return false;
            }

            try {
                const moduleUrl = './wasm/diec.js';
                const createDieModule = await import(moduleUrl);

                const module = await createDieModule.default({
                    locateFile: (path) => `./wasm/${path}`,
                    noCanvasRuntime: true,
                    print: (text) => {
                        window.dieOutputBuffer += text + '\n';
                        console.log('DIE out:', text);
                    },
                    printErr: (text) => {
                        console.error('DIE err:', text);
                    }
                });

                window.dieModule = module;
                console.log('完整 DIE WASM 加载成功');
                console.log('Module has FS:', !!module.FS);
                console.log('Module has callMain:', !!module.callMain);
                return true;
            } catch (e) {
                console.error('WASM 加载失败:', e);
                window.setStatus('wasm-error', e.message);
                errorDiv.style.display = 'block';
                errorText.textContent = i18n.t('wasm-error') + ': ' + e.message;
                return false;
            }
        };

        // 国际化对象
        const i18n = {
            translations: {
                zh: {
                    'subtitle': '基于 DIE-engine WASM 的文件检测工具',
                    'loading': '正在加载 WASM...',
                    'upload-tip': '拖放文件到此处或点击上传',
                    'select-file': '选择文件',
                    'results': '检测结果',
                    'format': '文件格式',
                    'compiler': '编译器/链接器',
                    'packer': '打包器/保护器',
                    'library': '库/框架',
                    'raw-output': '原始输出',
                    'analyzing': '正在分析文件...',
                    'based-on': '基于 <a href="https://github.com/horsicq/DIE-engine" target="_blank">DIE-engine</a> 编译为 WebAssembly',
                    'local-mode': '本地模式 - 请通过 HTTP 访问',
                    'local-error': 'WASM 需要 HTTP 协议。请在 docs 目录运行:\npython3 -m http.server 8080\n然后访问 http://localhost:8080',
                    'wasm-error': 'WASM 加载失败',
                    'wasm-ready': '完整 DIE 引擎已就绪',
                    'wasm-fail': 'WASM 加载失败',
                    'no-output': '无输出',
                    'detect-fail': '检测无结果',
                    'engine-init': 'WASM 引擎未初始化',
                    'detect-error': '检测失败',
                    'toggle-theme': '切换主题',
                    'toggle-lang': '切换语言'
                },
                en: {
                    'subtitle': 'File detection tool based on DIE-engine WASM',
                    'loading': 'Loading WASM...',
                    'upload-tip': 'Drag and drop file here or click to upload',
                    'select-file': 'Select File',
                    'results': 'Detection Results',
                    'format': 'File Format',
                    'compiler': 'Compiler/Linker',
                    'packer': 'Packer/Protector',
                    'library': 'Library/Framework',
                    'raw-output': 'Raw Output',
                    'analyzing': 'Analyzing file...',
                    'based-on': 'Based on <a href="https://github.com/horsicq/DIE-engine" target="_blank">DIE-engine</a> compiled to WebAssembly',
                    'local-mode': 'Local mode - Please use HTTP',
                    'local-error': 'WASM requires HTTP protocol. Run in docs directory:\npython3 -m http.server 8080\nThen visit http://localhost:8080',
                    'wasm-error': 'WASM loading failed',
                    'wasm-ready': 'Full DIE engine ready',
                    'wasm-fail': 'WASM loading failed',
                    'no-output': 'No output',
                    'detect-fail': 'No detection result',
                    'engine-init': 'WASM engine not initialized',
                    'detect-error': 'Detection failed',
                    'toggle-theme': 'Toggle theme',
                    'toggle-lang': 'Toggle language'
                }
            },
            t: function(key) {
                const lang = document.documentElement.getAttribute('data-lang') || 'zh';
                return this.translations[lang][key] || this.translations['zh'][key] || key;
            },
            apply: function() {
                const lang = document.documentElement.getAttribute('data-lang') || 'zh';
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    const translation = this.translations[lang][key];
                    if (translation) {
                        // 处理包含 HTML 的翻译
                        if (translation.includes('<a')) {
                            el.innerHTML = translation;
                        } else {
                            el.textContent = translation;
                        }
                    }
                });
                // 更新语言切换按钮显示
                document.getElementById('lang-toggle').textContent = lang === 'zh' ? 'EN' : '中';
                // 用当前状态 key 重新渲染 statusText（处理非 loading 的状态）
                if (window.setStatus && window.currentStatusKey && window.currentStatusKey !== 'loading') {
                    window.setStatus(window.currentStatusKey, window.currentStatusDetail);
                }
            }
        };

        // 主题切换
        const toggleTheme = () => {
            const currentTheme = document.documentElement.getAttribute("data-theme");
            const newTheme = currentTheme === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", newTheme);
            localStorage.setItem("theme", newTheme);
        };

        document.getElementById("theme-toggle").addEventListener("click", toggleTheme);

        // 监听系统主题变化
        if (window.matchMedia) {
            window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
                if (!localStorage.getItem("theme")) {
                    document.documentElement.setAttribute("data-theme", e.matches ? "dark" : "light");
                }
            });
        }

        // 语言切换
        document.getElementById("lang-toggle").addEventListener("click", () => {
            const currentLang = document.documentElement.getAttribute("data-lang");
            const newLang = currentLang === "zh" ? "en" : "zh";
            document.documentElement.setAttribute("data-lang", newLang);
            document.documentElement.lang = newLang === 'zh' ? 'zh-CN' : 'en';
            localStorage.setItem("lang", newLang);
            i18n.apply();
        });

        // 应用初始语言
        i18n.apply();
    </script>

    <!-- 应用逻辑 -->
    <script src="js/md5.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
