<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detect It Easy - Web</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 Detect It Easy - Web</h1>
            <p class="subtitle">基于 DIE-engine WASM 的文件检测工具</p>
            <div class="engine-status" id="engineStatus">
                <span class="status-indicator" id="statusIndicator">⏳</span>
                <span id="statusText">正在加载 WASM...</span>
            </div>
        </header>

        <main>
            <div class="upload-area" id="dropZone">
                <div class="upload-icon">📁</div>
                <p>拖放文件到此处或点击上传</p>
                <input type="file" id="fileInput" hidden>
                <button class="btn-primary" onclick="document.getElementById('fileInput').click()">
                    选择文件
                </button>
            </div>

            <div class="file-info" id="fileInfo" style="display: none;">
                <div class="info-header">
                    <span class="filename" id="fileName"></span>
                    <span class="filesize" id="fileSize"></span>
                </div>
                <div class="info-grid">
                    <div class="info-item">
                        <label>MD5</label>
                        <span id="hashMD5" class="hash-value">-</span>
                    </div>
                    <div class="info-item">
                        <label>SHA256</label>
                        <span id="hashSHA256" class="hash-value">-</span>
                    </div>
                    <div class="info-item">
                        <label>Entropy</label>
                        <span id="entropy">-</span>
                    </div>
                </div>
            </div>

            <div class="results" id="results" style="display: none;">
                <h2>检测结果</h2>

                <div class="result-section" id="formatSection">
                    <h3>📋 文件格式</h3>
                    <div class="result-content" id="formatResult"></div>
                </div>

                <div class="result-section" id="compilerSection" style="display: none;">
                    <h3>⚙️ 编译器/链接器</h3>
                    <div class="result-content" id="compilerResult"></div>
                </div>

                <div class="result-section" id="packerSection" style="display: none;">
                    <h3>📦 打包器/保护器</h3>
                    <div class="result-content" id="packerResult"></div>
                </div>

                <div class="result-section" id="librarySection" style="display: none;">
                    <h3>📚 库/框架</h3>
                    <div class="result-content" id="libraryResult"></div>
                </div>

                <div class="result-section" id="rawOutputSection" style="display: none;">
                    <div class="section-header">
                        <h3>📄 原始输出</h3>
                        <div class="format-buttons">
                            <button class="btn-small active" id="btnText" onclick="switchOutputFormat('text')">Text</button>
                            <button class="btn-small" id="btnJson" onclick="switchOutputFormat('json')">JSON</button>
                            <button class="btn-small" id="btnXml" onclick="switchOutputFormat('xml')">XML</button>
                        </div>
                    </div>
                    <div class="result-content raw-output" id="rawOutput"></div>
                </div>
            </div>

            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>正在分析文件...</p>
            </div>

            <div class="error-message" id="errorMessage" style="display: none;">
                <p id="errorText"></p>
            </div>
        </main>

        <footer>
            <p>基于 <a href="https://github.com/horsicq/DIE-engine" target="_blank">DIE-engine</a> 编译为 WebAssembly</p>
        </footer>
    </div>

    <!-- WASM 加载 -->
    <script>
        // 检测是否是 file:// 协议
        const isLocalFile = window.location.protocol === 'file:';

        // 全局输出缓冲区
        window.dieOutputBuffer = '';

        window.dieWasmInit = async function() {
            const statusText = document.getElementById('statusText');
            const statusIndicator = document.getElementById('statusIndicator');
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');

            if (isLocalFile) {
                statusText.textContent = '本地模式 - 请通过 HTTP 访问';
                statusIndicator.textContent = '⚠️';
                statusIndicator.className = 'status-indicator basic-active';
                errorDiv.style.display = 'block';
                errorText.textContent = 'WASM 需要 HTTP 协议。请在 docs 目录运行:\npython3 -m http.server 8080\n然后访问 http://localhost:8080';
                return false;
            }

            try {
                const moduleUrl = './wasm/diec.js';
                const createDieModule = await import(moduleUrl);

                const module = await createDieModule.default({
                    locateFile: (path) => `./wasm/${path}`,
                    noCanvasRuntime: true,
                    print: (text) => {
                        window.dieOutputBuffer += text + '\n';
                        console.log('DIE out:', text);
                    },
                    printErr: (text) => {
                        console.error('DIE err:', text);
                    }
                });

                window.dieModule = module;
                console.log('完整 DIE WASM 加载成功');
                console.log('Module has FS:', !!module.FS);
                console.log('Module has callMain:', !!module.callMain);
                return true;
            } catch (e) {
                console.error('WASM 加载失败:', e);
                errorDiv.style.display = 'block';
                errorText.textContent = 'WASM 加载失败: ' + e.message;
                return false;
            }
        };
    </script>

    <!-- 应用逻辑 -->
    <script src="js/md5.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
